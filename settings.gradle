pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = "https://maven.neoforged.net/releases" }
    }
}

dependencyResolutionManagement {
    repositories {
        mavenLocal()
        def techcraftLocalMaven = providers.gradleProperty("techcraft.localMaven")
                .orElse(providers.environmentVariable("TECHCRAFT_LOCAL_MAVEN"))
                .orNull
        if (techcraftLocalMaven != null && !techcraftLocalMaven.isBlank()) {
            maven {
                name = "TechCraftLocalMaven"
                url = uri(techcraftLocalMaven)
            }
        }
        maven { url = "https://maven.neoforged.net/releases" }
        mavenCentral()
    }
}

rootProject.name = "techcraft-additions"
